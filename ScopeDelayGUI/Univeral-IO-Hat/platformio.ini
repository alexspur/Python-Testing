[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = COM12
monitor_port = COM12
lib_deps =
    adafruit/Adafruit ADS1X15 @ ^2.5.0

build_flags =
    -DCORE_DEBUG_LEVEL=3
    ; Native USB-CDC OFF on purpose: GPIO19/20 carry A2DINT_I and SCL, which
    ; collide with the USB-OTG peripheral. Talk over the USB-UART bridge instead.
    -DARDUINO_USB_CDC_ON_BOOT=0
